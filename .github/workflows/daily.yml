name: daily-market-report
on:
  schedule:
    - cron: "40 22 * * 1-5"   # 07:40 KST 화~토 (미국장 마감 후) → 8시 전 도착
  workflow_dispatch:
permissions:
  contents: write
jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: 설치
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk
          pip install -q yfinance pandas lxml playwright
          python -m playwright install --with-deps chromium
      - name: 데이터 수집
        run: python fetch.py
      - name: 이미지 생성
        run: python render.py && python shot.py
      - name: 텔레그램 전송
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
        run: |
          API="https://api.telegram.org/bot${TG_TOKEN}"
          
          curl -s -d chat_id="$TG_CHAT" --data-urlencode text@out/summary.txt "$API/sendMessage" > /dev/null
          curl -s -F chat_id="$TG_CHAT" -F document=@out/table.png "$API/sendDocument" > /dev/null
          curl -s -F chat_id="$TG_CHAT" -F document=@out/check.png "$API/sendDocument" > /dev/null
      - name: 데이터 저장
        run: |
          git config user.name "market-bot"
          git config user.email "market-bot@users.noreply.github.com"
          git add data && git commit -qm "data $(date -u +%F)" || echo "no change"
          git push
