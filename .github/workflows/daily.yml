name: daily-market-report
on:
  schedule:
    - cron: "35 21 * * 1-5"
    - cron: "5 22 * * 1-5"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: daily-market-report
  cancel-in-progress: false
jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: 설치
        run: pip install -q yfinance pandas lxml
      - name: 데이터 수집
        run: python fetch.py
      - name: 데이터 저장
        run: |
          git config user.name "market-bot"
          git config user.email "market-bot@users.noreply.github.com"
          git add data
          git commit -qm "data $(date -u +%F)" || { echo "no change"; exit 0; }
          for i in 1 2 3 4; do
            git pull --rebase -X theirs -q && git push -q && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((i*5))
          done
          exit 1
